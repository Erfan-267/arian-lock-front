<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arian Lock | نظرسنجی</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../asset/myStyle.css">
    <link rel="stylesheet" href="../asset/survey.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="../image/arian lock logo.png" type="image/x-icon">
</head>
<body class="bg-black">
    
    <div class="conteier content hide">
        <form action="" id="form-survery">
            <section>
                <span>فرم نظرسنجی مشتران</span>
            </section>
            <section>
                <label for="" class="optional">
                    <section class="tit-label-1">
                        <span>میزان رضای شما از کیفیت خدمات ارائه شده چقدر بود؟</span>
                    </section>
                    <section class="tit-label-2">
                        <span>کاملا راضی<input type="radio" name="sufficiency-satisfaction" id="" value="totally-satisfied"></span>
                        <span>راضی<input type="radio" name="sufficiency-satisfaction" id="" value="satisfied"></span>
                        <span>ناراضی<input type="radio" name="sufficiency-satisfaction" id="" value="unhappy"></span>
                        <span>کاملا ناراضی<input type="radio" name="sufficiency-satisfaction" id="" value="totally-unhappy"></span>
                    </section>
                </label>
                <label for="" class="optional">
                    <section class="tit-label-1">
                        <span>میزان رضای شما از هزینه و تخمین مدت زمانه ارائه خدمات چقدر بود؟</span>
                    </section>
                    <section class="tit-label-2">
                        <span>کاملا راضی<input type="radio" name="delivery-satisfaction" id="" value="totally-satisfied"></span>
                        <span>راضی<input type="radio" name="delivery-satisfaction" id="" value="satisfied"></span>
                        <span>ناراضی<input type="radio" name="delivery-satisfaction" id="" value="unhappy"></span>
                        <span>کاملا ناراضی<input type="radio" name="delivery-satisfaction" id="" value="totally-unhappy"></span>
                    </section>
                </label>
                <label for="" class="optional">
                    <section class="tit-label-1">
                        <span>میزان رضای شما از نحوه برخورد کارکنان و همکاران چقدر بود؟</span>
                    </section>
                    <section class="tit-label-2">
                        <span>کاملا راضی<input type="radio" name="employee-satisfaction" id="" value="totally-satisfied"></span>
                        <span>راضی<input type="radio" name="employee-satisfaction" id="" value="satisfied"></span>
                        <span>ناراضی<input type="radio" name="employee-satisfaction" id="" value="unhappy"></span>
                        <span>کاملا ناراضی<input type="radio" name="employee-satisfaction" id="" value="totally-unhappy"></span>
                    </section>
                </label>
                <label for="" class="optional">
                    <section class="tit-label-1">
                        <span>میزان رضای شما از روند ارئه خدمات و سرعت آن چقدر بود؟</span>
                    </section>
                    <section class="tit-label-2">
                        <span>کاملا راضی<input type="radio" name="speed-satisfaction" id="" value="totally-satisfied"></span>
                        <span>راضی<input type="radio" name="speed-satisfaction" id="" value="satisfied"></span>
                        <span>ناراضی<input type="radio" name="speed-satisfaction" id="" value="unhappy"></span>
                        <span>کاملا ناراضی<input type="radio" name="speed-satisfaction" id="" value="totally-unhappy"></span>
                    </section>
                </label>
            </section>
            <section>
                <label for="" class="text-white font-bold"><span>توضیحات تکمیل در صورت نیاز:</span></label>
                <label for="">
                    <textarea name="" id="" placeholder="نظرات خود را بنویسید..."></textarea>
                </label>
            </section>
            <section>
                <button type="submit">ارسال</button>
            </section>
        </form>
    </div>

    <script src="../script/jquery3.7.1.js"></script>
    <script src="../script/jquery.toast.js"></script>
    <script src="../script/main.js"></script>
</body>
</html>
