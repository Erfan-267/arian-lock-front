<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../asset/myStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="../image/arian lock logo.png" type="image/x-icon">
    <title>ورود | ArianLock</title>
    <style>
      
      .main{
        width: 350px;
        height: 500px;
        overflow: hidden;
        background: url("https://doc-08-2c-docs.googleusercontent.com/docs/securesc/68c90smiglihng9534mvqmq1946dmis5/fo0picsp1nhiucmc0l25s29respgpr4j/1631524275000/03522360960922298374/03522360960922298374/1Sx0jhdpEpnNIydS4rnN4kHSJtU1EyWka?e=view&authuser=0&nonce=gcrocepgbb17m&user=03522360960922298374&hash=tfhgbs86ka6divo3llbvp93mg4csvb38") no-repeat center/ cover;
        border-radius: 10px;
        box-shadow: 1px 1px 50px #db1818;
      }
      #chk{
        display: none;
      }
      .signup{
        position: relative;
        width:100%;
        height: 100%;
      }
      label{
        color: #ffff00;
        font-size: 2.3em;
        justify-content: center;
        display: flex;
        margin: 50px;
        font-weight: bold;
        cursor: pointer;
        transition: .5s ease-in-out;
      }
      .InPut{
        width: 60%;
        height: 10px;
        background: white;
        justify-content: center;
        display: flex;
        margin: 10px auto;
        padding: 12px;
        border: 1px solid #ffff00;
        outline: none;
        border-radius: 5px;
        text-align: right;
      }
      button{
        width: 60%;
        height: 40px;
        margin: 10px auto;
        justify-content: center;
        display: block;
        color: #000;
        background: #ffff00;
        font-size: 1em;
        font-weight: bold;
        margin-top: 10px;
        outline: none;
        border: none;
        border-radius: 5px;
        transition: .2s ease-in;
        cursor: pointer;
      }
      button:hover{
        background: #000;
        color: #ffff00;
        border:1px solid #ffff00;
      }
      .login{
        height: 460px;
        background: #db1818;
        border-radius: 60% / 10%;
        transform: translateY(-180px);
        transition: .8s ease-in-out;
      }
      .login label{
        color: white;
        transform: scale(.6);
      }

      #chk:checked ~ .login{
        transform: translateY(-500px);
      }
      #chk:checked ~ .login label{
        transform: scale(1);	
      }
      #chk:checked ~ .signup label{
        transform: scale(.6);
      }
      @media screen and (max-width:600px){
        .main{
            width: 320px;
        }
      }
    </style>
</head>
<body class="bg-black">
    <main class="w-[100%] h-[85svh] flex items-center justify-center">
        <div class="main">  	
      <input type="checkbox" id="chk" aria-hidden="true">
        <div class="signup">
          <form>
            <label for="chk" aria-hidden="true">ثبت نام</label>
            <input type="text" name="username" placeholder="نام کاربری" required class="InPut">
            <input type="number" name="mobile" placeholder="شماره تلفن" required class="InPut">
            <input type="password" name="pswd" placeholder="رمز عبور" required class="InPut">
            <input type="password" name="repswd" placeholder="تکرار رمز" required class="InPut">
            <span class="dir-cont flex justify-center items-center gap-2"><input type="checkbox" name="getRulse" id="" class="w-5 h-5 border-1 border-[#FFFF00]" required><span class="text-white font-bold text-[0.9rem]">ثبت نام شما به معنی قبول <a href="" class="text-[#FFFF00] underline">مقررات</a> است.</span></span>
            <button>ثبت نام</button>
          </form>
        </div>

        <div class="login">
          <form>
            <label for="chk" aria-hidden="true">ورود</label>
            <input type="number" name="mobile" placeholder="شماره تلفن" required class="InPut">
            <input type="password" name="pswd" placeholder="رمز عبور" required class="InPut">
            <button>ورود</button>
          </form>
        </div>
    </div> 
    </main>

    <script src="../script/jquery3.7.1.js"></script>
    <script src="../script/jquery.toast.js"></script>
    <script src="../script/main.js"></script>
</body>
</html>
