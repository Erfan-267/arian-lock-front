<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احراز هویت</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../asset/myStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" href="../image/arian lock logo.png" type="image/x-icon">
</head>
<body class="bg-black">
    <main class="w-[100%] h-[85svh] flex justify-center items-center">
        <form action="" method="post" class="w-80 h-100 rounded-xl shadow-lg shadow-[#db1818] border-1 border-[#db1818]">
            <section class="w-[100%] h-20 flex justify-center items-center">
                <label for="" class="text-[#db1818] text-[2rem]">احراز هویت</label>
            </section>
            <section class="w-[100%] h-55 flex flex-col items-center justify-center gap-5">
                <input type="text" class="w-60 h-8 bg-white rounded-md border-2 border-[#ffff00] outline dir-text text-center" placeholder="نام">
                <input type="text" class="w-60 h-8 bg-white rounded-md border-2 border-[#ffff00] outline dir-text text-center" placeholder="نام خانوادگی">
                <input type="email" class="w-60 h-8 bg-white rounded-md border-2 border-[#ffff00] outline text-center" placeholder="ایمیل">
            </section>
            <section class="w-[100%] h-25 flex justify-center items-start">
                <button type="submit" class="w-60 h-13 bg-[#ffff00] rounded-md text-[1.5rem] hover:text-[#ffff00] hover:border-2 hover:border-[#ffff00] hover:bg-black duration-500 cursor-pointer">تکمیل</button>
            </section>
        </form>
    </main>

    <script src="../script/jquery3.7.1.js"></script>
    <script src="../script/jquery.toast.js"></script>
    <link rel="stylesheet" href="../asset/jquery.toast.css">
    <script src="../script/main.js"></script>
</body>
</html>
